<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Type a product review and watch a sentiment model trained on 15,375 reviews read it word by word. Explore three-star reviews, the model's vocabulary and its accuracy." />
    <meta name="theme-color" content="#efedf4" />
    <script>
      // Resolve the theme before first paint (mirrors src/theme.ts).
      (function () {
        var t = "light";
        try {
          var s = localStorage.getItem("jmd-theme");
          t = s === "light" || s === "dark" ? s : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {
          try { t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e2) {}
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#15131d" : "#efedf4";
      })();
    </script>
    <link rel="icon" href="./star.svg" type="image/svg+xml" />
    <title>Read between the stars</title>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <div id="root"></div>
    <noscript>This site runs a model in your browser, so it needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
